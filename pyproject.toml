[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-legal-document-qa"
version = "0.1.0"
description = "System answers legal questions over the Egyptian Civil Code"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Manar Saber" }]

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "sentence-transformers",
    "qdrant-client",
    "rank-bm25",
    "mlflow",
    "google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
ocr = ["pymupdf", "numpy", "huggingface_hub", "pillow"]
eval = ["ragas", "langchain-google-genai"]
dev = ["pytest", "pytest-cov", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"